<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><title>Droppoint — Web Share</title><link rel="stylesheet" href="styles.css"></head><body><main class="shell"><header><div><span class="eyebrow">DROPPOINT</span><h1>Gönder. Al. Bitti.</h1><p>Dosya ve metni tarayıcıdan cihazdan cihaza paylaş.</p></div><div id="status" class="status off">● Bağlı değil</div></header><section class="room card"><div class="room-row"><div><label>Oda kodu</label><div id="roomCode" class="room-code">—</div></div><button id="copyRoom" class="ghost" disabled>Kopyala</button></div><div class="actions"><button id="create">Yeni oda oluştur</button><div class="join"><input id="roomInput" maxlength="6" autocomplete="off" placeholder="ABC123"><button id="join">Katıl</button></div></div></section><section class="grid"><div class="card"><div class="card-head"><h2>Dosya</h2><span>Her tür</span></div><label for="file" class="drop"><input id="file" type="file" multiple><strong>Dosyaları seç veya buraya bırak</strong><small>Aktarım doğrudan diğer tarayıcıya yapılır.</small></label><div id="fileList" class="list"></div><button id="sendFile" class="primary full" disabled>Dosyaları gönder</button></div><div class="card"><div class="card-head"><h2>Metin</h2><span>Hızlı paylaş</span></div><textarea id="text" maxlength="20000" placeholder="Paylaşmak istediğin metni yaz…"></textarea><div class="text-foot"><small id="count">0 / 20.000</small><button id="sendText" class="primary" disabled>Metni gönder</button></div></div></section><section class="card activity"><div class="card-head"><h2>Aktivite</h2><button id="clear" class="ghost">Temizle</button></div><div id="activity"><p class="muted">Bir oda oluştur veya mevcut odaya katıl.</p></div></section></main><template id="fileItem"><div class="file-item"><span class="file-icon">↗</span><div class="meta"><b></b><small></small></div><span class="progress"></span></di
