<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6750A4"><title>Droppoint — Gönder</title><link rel="stylesheet" href="styles.css"></head><body data-page="transfer"><header class="topbar"><a class="brand-lockup" href="/"><span class="brand-mark">D</span><span><b>Droppoint</b><small>Web Share</small></span></a><span id="status" class="status off"><span class="status-dot"></span> Bağlanıyor</span></header><main class="page narrow"><nav class="breadcrumbs"><span>Oda</span><span>İçerik</span><span class="active">Gönder</span></nav><section class="surface transfer-surface"><div class="transfer-top"><div><span class="eyebrow">3. ADIM</span><h1 id="transferTitle">Paylaş</h1><p class="lead" id="transferLead">Cihazlar eşleştiğinde gönderim başlayabilir.</p></div><div class="room-badge"><small>ODA</small><b id="transferRoom">------</b></div></div><div id="connectNotice" class="notice info">Diğer cihaz bekleniyor…</div><section id="filePanel" class="transfer-panel hidden"><label for="file" class="drop large-drop"><input id="file" type="file" multiple><span class="drop-symbol">↥</span><strong>Dosyaları seç veya bırak</strong><small>Birden fazla dosya seçebilirsin.</small></label><div id="fileList" class="list"></div><button id="sendFile" class="m3-btn filled wide" disabled>Dosyaları gönder</button></section><section id="textPanel" class="transfer-panel hidden"><textarea id="text" maxlength="20000" placeholder="Paylaşmak istediğin metni yaz…"></textarea><div class="text-foot"><small id="count">0 / 20.000</small><button id="sendText" class="m3-btn filled" disabled>Metni gönder</button></div></section><section class="received-panel"><div class="panel-heading"><div><h2>Alınanlar</h2><p>Diğer cihazdan gelen içerikler burada görünür.</p></div><button id="clear" class="text-button">Temizle</button></div><div id="received" class="received-list"><p class="mu
