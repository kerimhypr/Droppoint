services:
  - type: web
    name: orbit-gateway
    runtime: node
    region: frankfurt
    plan: starter
    buildFilter:
      paths:
        - apps/gateway/**
        - packages/contracts/**
        - package.json
        - pnpm-workspace.yaml
        - tsconfig.json
    buildCommand: corepack enable && pnpm install --no-frozen-lockfile && pnpm --filter @clone/contracts build && pnpm --filter @clone/gateway build
    startCommand: node apps/gateway/dist/server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: orbit-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: orbit-redis
          property: connectionString
      - key: JWT_JWKS_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: TURN_URL
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false

  - type: web
    name: orbit-client
    runtime: static
    region: frankfurt
    plan: free
    buildFilter:
      paths:
        - apps/client/**
        - packages/contracts/**
        - package.json
        - pnpm-workspace.yaml
        - tsconfig.json
    buildCommand: corepack enable && pnpm install --no-frozen-lockfile && pnpm --filter @clone/client build
    staticPublishPath: apps/client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: keyvalue
    name: orbit-redis
    region: frankfurt
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList:
      - source: 0.0.0.0/0
        description: "Restrict to private network or approved egress CIDRs in production"

databases:
  - name: orbit-postgres
    databaseName: orbit
    user: orbit_app
    region: frankfurt
    plan: basic-1gb
    diskSizeGB: 15
    storageAutoscalingEnabled: true
    connectionPool: pgbouncer

previews:
  generation: manual
  expireAfterDays: 5
